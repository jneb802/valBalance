# Population roll ranges and reward difficulty divisors.
populationModifiers:
  VE_PopulationStandard:
    difficultyPer: 25
    ranges:
      Magic: {min: 5, max: 10}
      Rare: {min: 10, max: 20}
      Epic: {min: 20, max: 30}
      Legendary: {min: 30, max: 50}
      Mythic: {min: 40, max: 60}
      Ancient: {min: 50, max: 75}
  VE_PopulationSupport:
    difficultyPer: 25
    ranges:
      Magic: {min: 5, max: 10}
      Rare: {min: 10, max: 20}
      Epic: {min: 20, max: 30}
      Legendary: {min: 30, max: 50}
      Mythic: {min: 40, max: 60}
      Ancient: {min: 50, max: 75}
  VE_PopulationElite:
    difficultyPer: 25
    ranges:
      Magic: {min: 5, max: 10}
      Rare: {min: 10, max: 15}
      Epic: {min: 15, max: 20}
      Legendary: {min: 20, max: 25}
      Mythic: {min: 25, max: 30}
      Ancient: {min: 30, max: 35}
  VE_PopulationBosses:
    difficultyPer: 1
    ranges:
      Epic: {min: 1, max: 1}
      Legendary: {min: 2, max: 2}
      Mythic: {min: 3, max: 3}
      Ancient: {min: 4, max: 4}
