version: 1
status: local_candidate_not_combat_validated
tribute: {prefab: Resin, amount: 10}
shrine: VF_wild_shrine_yellow1
baseline:
  source: Mountain role HTD comparison, 2026-10-15
  priority: Match incoming threat with stars; accept the resulting increase in health.
  reference_player: Snuffiss
  health_per_star: 1.0
  damage_per_star: 0.25
  maximum_stars: 10000
  target_htd: {standard: 10, magic: 3, rare: 4, miniboss: 3, boss: 3}
  attack_selection: Strongest modeled individual impact after the reference player's defenses.
  next_tier_health_factor: 1.11
  next_tier_damage_factor: 1.06
  later_tiers: Recalculate after accepting this Tier 1 in combat; do not install higher-tier changes yet.
assumptions:
  - Full health, fresh food, Deep North cape, fire/frost/poison resistance meads.
  - No recovery, blocking, dodging, shield, or temporary buffs.
  - Each individual attack includes its full damage-over-time payload before another hit.
  - Random SLS modifiers, enemy healing, projectile volleys, and attack cadence are not modeled here.
  - Skeleton randomly equips sword or bow; no guaranteed archer count.
  - Elder roots use his native ability; their stats do not inherit the configured Elder stars.
  - Bone Pile needs object and child-spawn tracking in Fortress and is not enabled.
