      levelIndex: 1
      biome: BlackForest
      waveFormat: DynamicBoss
      levelWarningLocalization: Kill the healers. Watch the bear. The troll comes
        last.
      maxCreaturesPerPhaseOverride: 10
      onlySelectMonsters:
      - EndForestGreydwarf
      - EndForestBrute
      - EndForestShaman
      - EndForestBear
      - EndForestTroll
      commonSpawnModifiers: {}
      rareSpawnModifiers: {}
      eliteSpawnModifiers: {}
      creatureRules:
      - creatures:
        - EndForestGreydwarf
        minStars: 19
        maxStars: 19
      - creatures:
        - EndForestBrute
        minStars: 25
        maxStars: 25
        modifiers:
          major:
          - Lightning
          - Frost
      - creatures:
        - EndForestShaman
        minStars: 20
        maxStars: 20
      - creatures:
        - EndForestBear
        minStars: 19
        maxStars: 19
        modifiers:
          major:
          - Lightning
      - creatures:
        - EndForestTroll
        minStars: 39
        maxStars: 39
