        linearIncreaseRandomWaveAdjustment: true
      rareSpawnModifiers: null
      eliteSpawnModifiers: null
  - tributeName: TrophySkeleton
    tributeAmount: 3
    rewards:
      DustRare: 10
      EssenceRare: 10
      ReagentRare: 10
    hardMode: false
    siegeMode: false
    wildshrineWaveStartLocalization: $wild_skeleton_attack
    wildshrineWaveEndLocalization: $wild_skeleton_defeated
    wildLevelDefinition:
      levelIndex: 4
      biome: BlackForest
      waveFormat: Easy
      levelWarningLocalization: $blackforest_warning_wilderness
      maxCreaturesPerPhaseOverride: 15
      onlySelectMonsters:
      - Skeleton
      - SkeletonArcher
      - RancidSkeleton
      excludeSelectMonsters:
      - EndForestGreydwarf
      - EndForestBrute
