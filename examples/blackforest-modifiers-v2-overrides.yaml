# Fragment to place inside the event's wildLevelDefinition using PR 19.
# Design candidate only: no tribute, reward, wave-selection, or catalog changes here.
# Bjorn must first exist as an enabled creature in SpawnableCreatures.yaml.
# Empty slsModifiers clears inherited requirements, NOT random SLS modifiers.
creatureOverrides:
  - creatures: [Greydwarf]
    minimumStars: 19
    maximumStars: 19
    slsModifiers: {}
  - creatures: [Greydwarf_Elite]
    minimumStars: 25
    maximumStars: 25
    slsModifiers:
      Lightning: Major
      Frost: Major
  - creatures: [Greydwarf_Shaman]
    minimumStars: 24
    maximumStars: 24
    slsModifiers: {}
  - creatures: [Bjorn]
    minimumStars: 19
    maximumStars: 19
    slsModifiers:
      Lightning: Major
  - creatures: [Troll]
    minimumStars: 39
    maximumStars: 39
    slsModifiers: {}
